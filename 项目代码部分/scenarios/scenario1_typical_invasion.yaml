# 场景1：典型入侵场景
name: 典型入侵场景
description: 单个可疑水面目标从东南方向入侵，需要多设备协同搜索、跟踪、驱赶

# 入侵者定义
intruders:
  - id: intruder-001
    type: surface_ship      # 水面船只
    name: 可疑目标
    initial_position: [9000, 9000, 0]  # x, y, z (z=0表示水面)
    velocity: [-3.0, -3.0, 0]  # 向西北方向移动
    trajectory:
      - time: 0
        position: [9000, 9000, 0]
      - time: 300
        position: [7000, 7000, 0]
      - time: 600
        position: [5000, 5000, 0]

# 任务定义
mission:
  type: intercept_and_drive
  description: 拦截并驱赶入侵者离开敏感区域

  phases:
    - name: 搜索阶段
      duration: 300  # 5分钟
      objectives:
        - 发现并确认目标
        - 持续跟踪目标

    - name: 跟踪阶段
      duration: 600  # 10分钟
      objectives:
        - 保持对目标的持续监视
        - 收集目标信息

    - name: 驱赶阶段
      duration: 900  # 15分钟
      objectives:
        - 发出警告
        - 实施包围拦截
        - 引导目标离开

  success_criteria:
    - 目标离开敏感区域
    - 目标未进入禁入区
    - 我方设备无损失

# 初始设备状态
devices:
  uavs:
    - id: uav-001
      status: standby
    - id: uav-002
      status: standby
    - id: uav-003
      status: standby
  usvs:
    - id: usv-001
      status: standby
    - id: usv-002
      status: standby
  uuvs:
    - id: uuv-001
      status: standby
    - id: uuv-002
      status: standby

# 仿真时长
duration: 1800  # 30分钟

# 环境参数（覆盖全局配置）
environment:
  sea_state: 2
  wind_speed: 8
  visibility: 4000
