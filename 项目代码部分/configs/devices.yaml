# 设备配置文件

# 无人机配置
uav:
  count: 3
  max_speed: 50        # 最大速度（m/s）
  max_height: 1000     # 最大飞行高度（米）
  min_height: 50        # 最低安全高度（米）
  sensor_range: 2000    # 传感器探测范围（米）
  communication_range: 5000  # 通信范围（米）
  max_flight_time: 3600     # 最大续航时间（秒）
  initial_position:
    - [1000, 1000, 200]
    - [1000, 2000, 200]
    - [2000, 1000, 200]

# 无人艇配置
usv:
  count: 2
  max_speed: 15        # 最大速度（m/s）
  sensor_range: 3000    # 传感器探测范围（米）
  communication_range: 10000  # 通信范围（米）
  max_sailing_time: 7200     # 最大续航时间（秒）
  initial_position:
    - [5000, 5000, 0]
    - [5000, 6000, 0]

# 无人潜航器配置
uuv:
  count: 2
  max_speed: 10        # 最大速度（m/s）
  max_depth: 300       # 最大潜深（米）
  min_depth: 10        # 最小潜深（米）
  sensor_range: 1500    # 传感器探测范围（米）
  communication_range: 3000   # 通信范围（米）
  max_diving_time: 14400      # 最大续航时间（秒）
  initial_position:
    - [3000, 3000, -50]
    - [4000, 4000, -50]
